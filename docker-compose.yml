services:
  reconai:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:9889:9889"   # bind to localhost; put a reverse proxy/VPN in front for remote access
    volumes:
      - reconai-data:/data      # named volume: inherits the image's ownership of /data (uid 10001)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    restart: unless-stopped

volumes:
  reconai-data: